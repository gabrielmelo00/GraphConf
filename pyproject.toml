[project]
name = "graphconf"
version = "0.1.0"
description = "Graph conformal prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ase>=3.27.0",
  "h5py>=3.15.1",
  "huggingface-hub>=1.4.0",
  "igraph>=1.0.0",
  "jupyter>=1.1.1",
  "lightning>=2.6.1",
  "matchms>=0.21.1",
  "msml",
  "notebook>=7.5.3",
  "numba>=0.63.1",
  "pandarallel>=1.6.5",
  "pandas>=3.0.0",
  "pip>=26.0.1",
  "plotly>=6.5.2",
  "polars>=1.38.1",
  "pot>=0.9.6.post1",
  "pygmtools>=0.5.5",
  "pyopenms>=3.5.0",
  "quantile-forest>=1.4.1",
  "rdkit>=2025.9.4",
  "ruamel-yaml>=0.19.1",
  "scipy>=1.17.0",
  "seaborn>=0.13.2",
  "torch>=2.10.0",
  "torch-geometric>=2.7.0",
  "torchvision>=0.25.0",
  "tqdm>=4.67.3",
  "transformers>=5.1.0",
  "typst>=0.14.8",
  "umap-learn>=0.5.11",
  "wandb>=0.24.2",
]

[dependency-groups]
dev = ["pyrefly>=0.51.0", "ruff>=0.15.0"]
models = ["specbridge", "dreams", "Any2Graph"]

[tool.uv.workspace]
members = ["Models/SpecBridge", "Models/SpecBridge/DreaMS", "Models/Any2Graph"]

[tool.uv.sources]
specbridge = { workspace = true, editable = true }
dreams = { workspace = true, editable = true }
Any2Graph = { workspace = true, editable = true }
msml = { git = "https://github.com/roman-bushuiev/msml_legacy_architectures.git", rev = "main" }

[tool.ruff]
extend-exclude = ["Models"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
